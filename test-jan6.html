<!DOCTYPE html>
<html>
<head>
    <title>Test January 6th</title>
    <script src="data/pagan.js"></script>
    <script src="data/holidays.js"></script>
</head>
<body>
    <h1>Testing January 6th - Should have BOTH holiday and pagan</h1>
    <div id="results"></div>
    
    <script>
        const testDate = new Date(2026, 0, 6); // January 6, 2026
        const results = document.getElementById('results');
        
        // Test pagan
        const hasPagan = paganTraditions && paganTraditions.hasPaganTradition(testDate);
        results.innerHTML += `<p>Has Pagan: ${hasPagan}</p>`;
        
        if (hasPagan) {
            const paganInfo = paganTraditions.getPaganTradition(testDate, false);
            results.innerHTML += `<p>Pagan Info: ${JSON.stringify(paganInfo)}</p>`;
        }
        
        // Test holiday
        const holidays = holidayData.getHolidaysForYear(2026);
        const holidayKey = '0-6';
        const hasHoliday = holidays[holidayKey];
        results.innerHTML += `<p>Has Holiday: ${hasHoliday}</p>`;
        
        results.innerHTML += `<h2>Result: January 6th should show RED (holiday) + GREEN (pagan) borders</h2>`;
    </script>
</body>
</html>
